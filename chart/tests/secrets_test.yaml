# The `secretAssociation` framework has two call sites that must agree
# (see chart/CLAUDE.md, "Secret injection is a framework"):
#   - generateSecretObjects writes the value into the chart Secret when no
#     existingSecret is given;
#   - generateSecretDefs emits an explicit env entry pointing at the
#     customer's Secret when one is.
# Miss either and a service starts without its credential, silently.
suite: secret association
templates:
  - templates/workspace-www/deployment.yaml
  - templates/workspace-www/configmap.yaml
  - templates/workspace-www/secret.yaml
  - templates/maps-api/deployment.yaml
  - templates/maps-api/configmap.yaml
  - templates/maps-api/secret.yaml
  - templates/custom-feature-flags-configmap.yaml
release:
  name: carto
  namespace: default
tests:
  - it: writes an inline secret value into the chart Secret
    template: templates/workspace-www/secret.yaml
    set: &inline {appSecrets.googleMapsApiKey.value: example-value}
    asserts:
      - exists: {path: data.GOOGLE_MAPS_API_KEY}

  - it: reads an inline secret value through envFrom, without an explicit env entry
    template: templates/workspace-www/deployment.yaml
    set: *inline
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {secretRef: {name: carto-workspace-www}}
      - isNullOrEmpty:
          path: spec.template.spec.containers[0].env

  - it: leaves a customer-provided secret out of the chart Secret
    template: templates/workspace-www/secret.yaml
    set: &existing
      appSecrets.googleMapsApiKey.existingSecret.name: example-app-secrets
      appSecrets.googleMapsApiKey.existingSecret.key: google-maps-api-key
    asserts:
      - notExists: {path: data.GOOGLE_MAPS_API_KEY}

  - it: points the env var at the customer-provided Secret
    template: templates/workspace-www/deployment.yaml
    set: *existing
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_MAPS_API_KEY
            valueFrom:
              secretKeyRef: {name: example-app-secrets, key: google-maps-api-key}

  - it: redirects the whole envFrom to a component-level existingSecret and existingConfigMap
    template: templates/maps-api/deployment.yaml
    set:
      mapsApi.existingSecret: example-maps-api-secret
      mapsApi.existingConfigMap: example-maps-api-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {secretRef: {name: example-maps-api-secret}}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {configMapRef: {name: example-maps-api-config}}
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content: {secretRef: {name: carto-maps-api}}

  - it: adds extraEnvVarsSecret and extraEnvVarsCM next to the chart-managed ones
    template: templates/maps-api/deployment.yaml
    set:
      mapsApi.extraEnvVarsSecret: example-extra-secret
      mapsApi.extraEnvVarsCM: example-extra-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {secretRef: {name: carto-maps-api}}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {secretRef: {name: example-extra-secret}}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {configMapRef: {name: example-extra-config}}
