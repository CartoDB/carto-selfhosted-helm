# HorizontalPodAutoscalers enabled on a mix of API, worker and edge components.
# Deployments must omit `replicas` when autoscaling owns the count.
appConfigValues:
  selfHostedDomain: carto.example.invalid

mapsApi:
  autoscaling:
    enabled: true

workspaceApi:
  autoscaling:
    enabled: true

importApi:
  autoscaling:
    enabled: true

sqlWorker:
  autoscaling:
    enabled: true

router:
  autoscaling:
    enabled: true
