# The three unrelated secret mechanisms side by side (see chart/CLAUDE.md):
#   - a field-level appSecrets.*.existingSecret (one env var via secretAssociation)
#   - a component-level existingSecret / existingConfigMap (whole generated object replaced)
#   - extraEnvVarsSecret / extraEnvVarsCM (arbitrary extra env vars)
appConfigValues:
  selfHostedDomain: carto.example.invalid

appSecrets:
  googleMapsApiKey:
    existingSecret:
      name: example-app-secrets
      key: google-maps-api-key

mapsApi:
  existingSecret: example-maps-api-secret
  existingConfigMap: example-maps-api-config

workspaceApi:
  extraEnvVarsSecret: example-workspace-api-extra-secret
  extraEnvVarsCM: example-workspace-api-extra-config
