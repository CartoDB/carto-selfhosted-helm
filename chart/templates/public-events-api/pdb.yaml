{{- if and (.Values.appConfigValues.publicEventsApiEnabled) (not .Values.cartoConfigValues.onlyRunRouter) (or .Values.publicEventsApi.podDisruptionBudget.enabled .Values.highAvailability.enabled) }}
---
apiVersion: {{ .Values.global.kubernetesPolicyVersion }}
kind: PodDisruptionBudget
metadata:
  name: {{ template "carto.publicEventsApi.fullname" . }}-pdb
  namespace: {{ .Release.Namespace | quote }}
  labels:
spec:
{{- if .Values.publicEventsApi.podDisruptionBudget.enabled }}
{{- if .Values.publicEventsApi.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.publicEventsApi.podDisruptionBudget.minAvailable }}
{{- end }}
{{- if .Values.publicEventsApi.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.publicEventsApi.podDisruptionBudget.maxUnavailable }}
{{- end }}
{{- else }}
  maxUnavailable: 1
{{- end }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: public-events-api
{{- end }}
