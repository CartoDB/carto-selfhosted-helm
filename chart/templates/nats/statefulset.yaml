{{- if and ((include "carto.disconnected.enabled" .)) (not .Values.cartoConfigValues.onlyRunRouter) }}
apiVersion: {{ include "common.capabilities.statefulset.apiVersion" . }}
kind: StatefulSet
metadata:
  name: {{ template "carto.nats.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: nats
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{/* Single-node JetStream: more replicas need cluster routes, not pod copies */}}
  replicas: 1
  serviceName: {{ template "carto.nats.fullname" . }}
  {{- if .Values.nats.updateStrategy }}
  updateStrategy: {{- toYaml .Values.nats.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/nats/secret.yaml") . | sha256sum }}
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        {{- if .Values.nats.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.nats.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: nats
        {{- if .Values.nats.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" .Values.nats.podLabels "context" $) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ template "carto.commonSA.serviceAccountName" . }}
      {{- include "carto.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.nats.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.nats.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.nats.affinity }}
      affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.nats.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.nats.podAffinityPreset "component" "nats" "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.nats.podAntiAffinityPreset "component" "nats" "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nats.nodeAffinityPreset.type "key" .Values.nats.nodeAffinityPreset.key "values" .Values.nats.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.nats.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.nats.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.nats.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.nats.tolerations "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.nats.priorityClassName }}
      priorityClassName: {{ .Values.nats.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.nats.schedulerName }}
      schedulerName: {{ .Values.nats.schedulerName | quote }}
      {{- end }}
      {{- if .Values.nats.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.nats.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.nats.initContainers }}
      initContainers: {{- include "common.tplvalues.render" (dict "value" .Values.nats.initContainers "context" $) | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.nats.terminationGracePeriodSeconds }}
      containers:
        - name: nats
          image: {{ template "carto.nats.image" . }}
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          {{- if .Values.nats.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.nats.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.nats.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.nats.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.nats.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.nats.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: NATS_MAX_PAYLOAD
              value: {{ .Values.nats.maxPayload | quote }}
            - name: NATS_JETSTREAM_MAX_FILE_STORE
              value: {{ .Values.nats.jetstream.maxFileStore | quote }}
            {{- include "carto._utils.generateSecretDefs" (dict "vars" (list
              "NATS_AUTH_TOKEN"
             ) "context" $ ) | nindent 12 }}
            {{- if .Values.nats.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.nats.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            {{- $secretContent := include "carto._utils.generateSecretObjects" (dict "vars" (list
              "NATS_AUTH_TOKEN"
             ) "context" $ ) -}}
            {{- if $secretContent }}
            - secretRef:
                name: {{ include "carto.nats.secretName" . }}
            {{- end }}
            {{- if .Values.nats.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.nats.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.nats.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.nats.extraEnvVarsSecret "context" $) }}
            {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.nats.containerPorts.client }}
            - name: monitoring
              containerPort: {{ .Values.nats.containerPorts.monitoring }}
          {{- if .Values.nats.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.nats.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.nats.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.nats.livenessProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /healthz
              port: monitoring
          {{- end }}
          {{- if .Values.nats.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.nats.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.nats.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.nats.readinessProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /healthz
              port: monitoring
          {{- end }}
          {{- if .Values.nats.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.nats.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.nats.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.nats.startupProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /healthz
              port: monitoring
          {{- end }}
          {{- if .Values.nats.resources }}
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            {{- if .Values.nats.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.nats.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.nats.sidecars }}
        {{- include "common.tplvalues.render" (dict "value" .Values.nats.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        {{- if .Values.nats.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.nats.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "common.labels.matchLabels" . | nindent 10 }}
          app.kubernetes.io/component: nats
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size | quote }}
        {{- include "common.storage.class" (dict "persistence" .Values.nats.persistence "global" .Values.global) | nindent 8 }}
{{- end }}
