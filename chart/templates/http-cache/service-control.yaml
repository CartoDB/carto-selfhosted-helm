{{- if .Values.cdnInvalidatorSub.varnishFanout.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "carto.httpCache.controlServiceName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: http-cache
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.httpCache.containerPorts.http }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- if .Values.httpCache.service.labelSelectorsOverride }}
    {{- include "common.tplvalues.render" (dict "value" .Values.httpCache.service.labelSelectorsOverride "context" $) | nindent 4 }}
    {{- else }}
    {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: http-cache
    {{- end }}
{{- end }}
