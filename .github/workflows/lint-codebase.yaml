name: Lint codebase
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: ".*doc/.*|.*github/.*"

  check-helm-resources-changed:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          # Full git history is needed to get the diff with the main branch
          fetch-depth: 0

      - name: Get Helm Chart resources diff
        id: check-helm-resources-diff
        continue-on-error: true
        run: |
          export DIFF=$(git diff --unified=0 origin/main origin/${GITHUB_HEAD_REF} chart/values.yaml | grep -E "[0-9]+Mi|[0-9]+m")
          if [ -n "$DIFF" ]; then
            echo "resources-changed=true" >> $GITHUB_OUTPUT
          else
            echo "resources-changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR if Helm Chart resources changed
        uses: peter-evans/create-or-update-comment@v2
        if: steps.check-helm-resources-diff.outputs.resources-changed == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            :warning: Helm Chart resources have changed. Please make sure to update the documentation accordingly. You can find more information [here](https://cartodb.getoutline.com/doc/helm-chart-yJ3vxi6icN#h-deployment-resources).

  # Same checks as a local `make check`: helm lint, the chart/ci render matrix
  # with duplicate-key and schema validation, the chart/tests unit tests,
  # README drift, KOTS static checks.
  helm-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v3.18.2
      HELM_UNITTEST_VERSION: 1.0.3
      KUBECONFORM_VERSION: 0.8.0
      YAMLLINT_VERSION: 1.38.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform, yamllint and helm-unittest
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          pipx install "yamllint==${YAMLLINT_VERSION}"
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "${HELM_UNITTEST_VERSION}"

      - name: make check
        run: make check
