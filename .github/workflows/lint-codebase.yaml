name: Lint codebase
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: ".*doc/.*|.*github/.*"

  check-helm-resources-changed:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          # Full git history is needed to get the diff with the main branch
          fetch-depth: 0

      - name: Get Helm Chart resources diff
        id: check-helm-resources-diff
        continue-on-error: true
        run: |
          export DIFF=$(git diff --unified=0 origin/main origin/${GITHUB_HEAD_REF} chart/values.yaml | grep -E "[0-9]+Mi|[0-9]+m")
          if [ -n "$DIFF" ]; then
            echo "resources-changed=true" >> $GITHUB_OUTPUT
          else
            echo "resources-changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR if Helm Chart resources changed
        uses: peter-evans/create-or-update-comment@v2
        if: steps.check-helm-resources-diff.outputs.resources-changed == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            :warning: Helm Chart resources have changed. Please make sure to update the documentation accordingly. You can find more information [here](https://cartodb.getoutline.com/doc/helm-chart-yJ3vxi6icN#h-deployment-resources).

      - name: Check resource limits against the admission ceiling
        # Max container limits admitted on CARTO-managed clusters. A component above
        # this is rejected at admission and its Deployment sits at 0 replicas, so
        # raise the cluster policy first, then bump these. Source of truth for the
        # ceiling (keep MAX_* in sync with it):
        # https://github.com/CartoDB/gatekeeper-selfhosted-kubernetes/blob/main/gatekeeper/constraints/psp-container-limits.yaml
        env:
          MAX_CPU_M: 4000
          MAX_MEMORY_MI: 12288
        shell: bash
        run: |
          BAD=$(yq -r '.. | select(type == "!!map" and has("resources")) | [(path | join(".")), .resources.limits.cpu, .resources.limits.memory] | @tsv' chart/values.yaml \
            | awk -F'\t' -v max_cpu="$MAX_CPU_M" -v max_mem="$MAX_MEMORY_MI" '
                { cpu = $2; mem = $3
                  if (cpu ~ /m$/) sub(/m$/, "", cpu); else cpu *= 1000
                  if (mem ~ /Gi$/) { sub(/Gi$/, "", mem); mem *= 1024 } else sub(/Mi$/, "", mem)
                  if (cpu + 0 > max_cpu || mem + 0 > max_mem) print "  " $1 ": cpu=" $2 " memory=" $3 }')
          if [ -n "$BAD" ]; then
            echo "Resource limits above the admission ceiling ($MAX_CPU_M m CPU / $MAX_MEMORY_MI Mi):"
            echo "$BAD"
            echo "Raise the ceiling in https://github.com/CartoDB/gatekeeper-selfhosted-kubernetes (gatekeeper/constraints/psp-container-limits.yaml) and get it applied to the CARTO-managed clusters, then bump MAX_CPU_M / MAX_MEMORY_MI in this workflow."
            exit 1
          fi

  helm-readme-generator:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Generate container 'helm-readme-generator'
        run: |
          git clone https://github.com/bitnami-labs/readme-generator-for-helm
          docker build \
            -t helm-readme-generator \
            readme-generator-for-helm/
      - name: Check README values synced
        run: |
          set -ex
          cd chart/
          cp README.md README_old.md
          docker run --rm \
            -v "${PWD}":/my_helm \
            -w /my_helm \
            helm-readme-generator \
            readme-generator \
              --readme README.md \
              --values values.yaml

          if ! cmp README.md README_old.md >/dev/null 2>&1
          then
            echo "Files aren't equal"
            diff README_old.md README.md
            exit 1
          else
            echo "Files look equal!"
          fi
